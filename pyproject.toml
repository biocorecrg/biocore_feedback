[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biocore_feedback"
version = "0.2.0"
description = "Reusable Slack feedback widget and Django package for Biocore CRG apps"
readme = "README.md"
authors = [
    { name = "Luca Cozzuto", email = "lucacozzuto@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
django = [
    "django>=3.2",
]
fastapi = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "django>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["biocore_feedback*", "app*"]

[tool.setuptools.package-data]
biocore_feedback = ["static/biocore_feedback/*", "templates/biocore_feedback/*"]
